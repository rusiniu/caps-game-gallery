<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>CapsGame Gallery</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="CapsGame Gallery">
    <meta property="og:title" content="CapsGame Gallery">
    <meta property="og:description" content="Просмотр фишек всех коллекций.">
    <meta property="og:image" content="og-preview.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="CapsGame Gallery — просмотр фишек всех коллекций">
    <meta property="og:url" content="https://caps.kro4.ru/index.html">

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="CapsGame Gallery">
    <meta name="twitter:description" content="Просмотр фишек всех коллекций.">
    <meta name="twitter:image" content="og-preview.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
<div class="app-container">
    <div class="site-header">
        <h1><i class="bi bi-images"></i> CapsGame Gallery</h1>
        <p>Коллекции фишек игры CapsGame</p>
    </div>

    <div class="pill-tabs" id="collectionTabs">
        <div style="padding: 1rem; color: var(--text-muted);">Загрузка…</div>
    </div>

    <div class="collection-mini-grid" id="collectionMiniGrid" style="display: none;"></div>

    <div class="site-footer" id="siteFooter">
        <div class="footer-line" id="footerMeta">
            <i class="bi bi-cloud-check"></i> Загрузка данных…
        </div>
        <div class="footer-links">
            <a href="https://t.me/CapsTradeBot" target="_blank" rel="noopener" class="footer-link" title="API предоставлен @CapsTradeBot">
                <i class="bi bi-telegram"></i> Благодарим @CapsTradeBot за предоставленные данные
            </a>
        </div>
    </div>
</div>

<!-- МОДАЛКА -->
<div class="modal-overlay" id="collectionModal">
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal-header">
            <div class="modal-header-left">
                <div class="modal-header-logo" id="modalLogo"></div>
                <div style="min-width: 0;">
                    <h3 id="modalTitle">—</h3>
                </div>
            </div>
            <div class="modal-header-right">
                <button class="modal-close" id="modalClose" aria-label="Закрыть">
                    <i class="bi bi-x-lg"></i>
                </button>
            </div>
        </div>
        <div class="modal-body" id="modalBody"></div>
    </div>
</div>

<!-- Данные подключаем ДО common.js: window.CAPS_DATA -->
<script src="data/collections.js"></script>
<script src="js/common.js"></script>
<script>
(function() {
    const {
        fetchCollectionsList,
        getSnapshotMeta,
        escapeHtml,
        formatNumber,
        formatDate,
        getCollectionTypeInfo,
        buildCollectionLogoUrl,
        buildCollectionChipUrl
    } = window.CapsTools;

    const TYPE_ORDER = ['common', 'special', 'event', 'community', 'premium'];

    let collectionsList = [];
    let currentType = 'common';
    let lastFocusedCard = null;

    const modalEl = document.getElementById('collectionModal');
    const modalBody = document.getElementById('modalBody');
    const modalTitle = document.getElementById('modalTitle');
    const modalLogo = document.getElementById('modalLogo');

    // ---------- Табы ----------
    function renderTabs() {
        const tabsEl = document.getElementById('collectionTabs');
        const counts = {};
        collectionsList.forEach(c => { counts[c.type] = (counts[c.type] || 0) + 1; });

        const types = TYPE_ORDER.filter(t => counts[t] > 0)
            .concat(Object.keys(counts).filter(t => !TYPE_ORDER.includes(t)));

        if (types.length === 0) {
            tabsEl.innerHTML = '<div style="padding:1rem;color:var(--text-muted);">Нет коллекций</div>';
            return;
        }

        tabsEl.innerHTML = types.map(type => {
            const info = getCollectionTypeInfo(type);
            const isActive = type === currentType;
            const style = isActive ? `background:${info.color}; border-color:${info.color};` : '';
            return `
                <div class="pill-tab ${isActive ? 'active' : ''}" data-type="${escapeHtml(type)}" style="${style}">
                    <span>${info.emoji}</span>
                    <span>${escapeHtml(info.label)}</span>
                    <span class="tab-count">${counts[type]}</span>
                </div>
            `;
        }).join('');

        tabsEl.querySelectorAll('.pill-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                currentType = tab.dataset.type;
                renderTabs();
                renderMiniGrid();
            });
        });
    }

    // ---------- Мини-сетка ----------
    function renderMiniGrid() {
        const gridEl = document.getElementById('collectionMiniGrid');
        const items = collectionsList.filter(c => c.type === currentType);

        if (items.length === 0) {
            gridEl.style.display = 'none';
            return;
        }
        gridEl.style.display = 'grid';

        gridEl.innerHTML = items.map(col => {
            const logoUrl = buildCollectionLogoUrl(col.id);
            return `
                <div class="collection-mini" data-id="${escapeHtml(col.id)}" tabindex="0" role="button" aria-label="Открыть ${escapeHtml(col.title)}">
                    <div class="collection-mini-logo">
                        <img src="${logoUrl}" alt="${escapeHtml(col.title)}" loading="lazy"
                             onerror="this.parentNode.innerHTML='<span class=\\'placeholder\\'>🎴</span>'">
                    </div>
                    <div class="collection-mini-title" title="${escapeHtml(col.title)}">${escapeHtml(col.title)}</div>
                    <div class="collection-mini-meta">
                        <span>🃏 ${col.size ?? '—'}</span>
                        <span style="color:var(--text-dim);">${escapeHtml(col.id)}</span>
                    </div>
                </div>
            `;
        }).join('');

        gridEl.querySelectorAll('.collection-mini').forEach(card => {
            const open = () => {
                lastFocusedCard = card;
                openModal(card.dataset.id);
            };
            card.addEventListener('click', open);
            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    open();
                }
            });
        });
    }

    // ---------- Модалка ----------
    function openModal(collectionId) {
        const col = collectionsList.find(c => c.id === collectionId);
        if (!col) return;

        const typeInfo = getCollectionTypeInfo(col.type);
        const logoUrl = buildCollectionLogoUrl(col.id);

        // Шапка
        modalTitle.textContent = col.title;
        modalLogo.innerHTML = `<img src="${logoUrl}" alt=""
            onerror="this.parentNode.innerHTML='<span style=\\'font-size:1.6rem;opacity:0.4\\'>🎴</span>'">`;

        // Тело
        let html = `
            <div class="modal-pills">
                <span class="badge-type" style="background:${typeInfo.bg}; color:${typeInfo.color};">
                    ${typeInfo.emoji} ${escapeHtml(typeInfo.label)}
                </span>
                <span class="stat-pill">🃏 Размер: <strong>${col.size ?? '—'}</strong></span>
                <span class="stat-pill">📦 Тираж: <strong>${formatNumber(col.supply)}</strong></span>
                <span class="stat-pill">📅 Релиз: <strong>${formatDate(col.releasedAt)}</strong></span>
            </div>
        `;

        if (col.size && col.size > 0) {
            html += `
                <div class="modal-section-title">
                    <i class="bi bi-images"></i> Карточки коллекции
                    <span style="margin-left:auto; font-weight:600; font-size:0.85rem; color:var(--text-muted);">🃏 Всего: ${col.size}</span>
                </div>
                <div class="modal-chips-grid">
            `;
            for (let i = 1; i <= col.size; i++) {
                const url = buildCollectionChipUrl(col.id, i);
                html += `
                    <div class="modal-chip-card">
                        <div class="modal-chip-image">
                            <img src="${url}" loading="lazy" alt="Фишка #${i}"
                                onerror="this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22180%22%20height%3D%22180%22%20viewBox%3D%220%200%20180%20180%22%3E%3Crect%20width%3D%22180%22%20height%3D%22180%22%20fill%3D%22%231a2639%22%2F%3E%3Ctext%20x%3D%2290%22%20y%3D%22100%22%20font-size%3D%2214%22%20text-anchor%3D%22middle%22%20fill%3D%22%235f6d80%22%3E%E2%9D%8C%3C%2Ftext%3E%3C%2Fsvg%3E'">
                        </div>
                        <div class="modal-chip-number">#${i}</div>
                    </div>
                `;
            }
            html += `</div>`;
        } else {
            html += `<div class="empty-state" style="margin-top:1rem;">
                <i class="bi bi-question-circle"></i>
                <h4>Размер неизвестен</h4>
                <p>Не удалось определить количество фишек в коллекции.</p>
            </div>`;
        }

        modalBody.innerHTML = html;

        modalEl.classList.add('open');
        document.body.classList.add('modal-open');
        modalBody.scrollTop = 0;

        // Обновляем хеш, чтобы URL отражал открытую коллекцию
        if (location.hash !== '#' + collectionId) {
            history.replaceState(null, '', '#' + collectionId);
        }
    }

    function closeModal() {
        if (location.hash) {
            history.replaceState(null, '', location.pathname + location.search);
        }

        modalEl.classList.remove('open');
        document.body.classList.remove('modal-open');
        if (lastFocusedCard) {
            lastFocusedCard.focus();
            lastFocusedCard = null;
        }
    }

    document.getElementById('modalClose').addEventListener('click', closeModal);
    modalEl.addEventListener('click', (e) => {
        if (e.target === modalEl) closeModal();
    });
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && modalEl.classList.contains('open')) closeModal();
    });

    // ---------- Футер ----------
    function renderFooter() {
        const metaEl = document.getElementById('footerMeta');
        const meta = getSnapshotMeta();
        if (meta.generatedAt) {
            const d = new Date(meta.generatedAt);
            const formatted = isNaN(d.getTime())
                ? meta.generatedAt
                : d.toLocaleString('ru-RU', {
                    day: 'numeric', month: 'long', year: 'numeric',
                    hour: '2-digit', minute: '2-digit'
                });
            metaEl.innerHTML = `<i class="bi bi-cloud-check"></i> Данные от ${formatted} · коллекций: ${meta.count}`;
        } else {
            metaEl.innerHTML = `<i class="bi bi-cloud-check"></i> Данные из игры CapsGame`;
        }
    }

    // ---------- Инициализация ----------
    function init() {
        collectionsList = fetchCollectionsList();
        if (!collectionsList.length) {
            document.getElementById('collectionTabs').innerHTML =
                '<div style="padding:1rem;color:var(--danger);">❌ Не удалось загрузить коллекции</div>';
            return;
        }
        currentType = TYPE_ORDER.find(t => collectionsList.some(c => c.type === t)) || collectionsList[0].type;
        renderTabs();
        renderMiniGrid();
        renderFooter();

        // Открываем коллекцию по якорю, если он есть
        const hash = location.hash.replace('#', '');
        if (hash) {
            const col = collectionsList.find(c => c.id === hash);
            if (col) {
                // Небольшая задержка, чтобы DOM успел отрисоваться
                setTimeout(() => openModal(hash), 0);
            }
        }
    }

    window.addEventListener('hashchange', () => {
        const hash = location.hash.replace('#', '');
        if (hash) {
            const col = collectionsList.find(c => c.id === hash);
            if (col) openModal(hash);
            else closeModal();
        } else {
            closeModal();
        }
    });

    init();
})();
</script>
</body>
</html>
